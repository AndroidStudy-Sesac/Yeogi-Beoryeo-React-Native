name: Release branch cleanup

on:
  pull_request:
    branches: [develop, main]
    paths:
      - '.github/scripts/cleanup-release*'
      - '.github/workflows/release-cleanup.yml'
  pull_request_target:
    types: [closed]
    branches: [develop]

permissions:
  contents: read
  pull-requests: read

jobs:
  test:
    name: Release cleanup tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.14.0
      - name: Test cleanup guards and Git lease
        run: node --test .github/scripts/cleanup-release.node-test.cjs

  cleanup:
    name: Delete completed release branch
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: release-cleanup
    concurrency:
      group: release-cleanup-${{ github.event.pull_request.head.ref }}
      cancel-in-progress: false
    steps:
      - name: Require cleanup credential
        env:
          CLEANUP_KEY: ${{ secrets.RELEASE_CLEANUP_SSH_KEY }}
        run: test -n "$CLEANUP_KEY"
      - name: Checkout trusted workflow commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.sha }}
          ssh-key: ${{ secrets.RELEASE_CLEANUP_SSH_KEY }}
          ssh-strict: true
      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: 24.14.0
      - name: Verify both merges and delete unchanged release branch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node .github/scripts/cleanup-release.cjs
